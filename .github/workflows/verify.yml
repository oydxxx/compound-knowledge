name: Verify release artifacts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm run test:installer
      - run: npm pack --dry-run
      - run: python -B -m unittest discover -s tests/contract -v
      - run: python -B -m unittest discover -s tests/acceptance -v
